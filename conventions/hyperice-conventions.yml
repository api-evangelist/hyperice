versioning:
  - surface: graphql
    scheme: date-based calendar version in the URL path
    current: '2026-04'
    supported: ['2025-10', '2026-01', '2026-04', '2026-07']
    discovery: 'query { publicApiVersions { handle supported displayName } }'
    header: x-shopify-api-version returned on every response
    retired_behaviour: 'HTTP 404 {"errors":[{"message":"Not Found","extensions":{"code":"NOT_FOUND"}}]}'
  - surface: mcp-ucp
    scheme: date-based protocol version
    current: '2026-04-08'
    supported: ['2026-04-08', '2026-01-23']
    discovery: GET /.well-known/ucp
  - surface: rest
    scheme: unversioned
    note: The .json storefront endpoints carry no version segment and no version header.
content_negotiation:
  mcp_accept: 'application/json, text/event-stream'
  graphql: application/json
  rest: application/json
localization:
  locales: 17
  mechanism: >-
    URL path prefix (/fr-fr/, /de-de/, /en-gb/, /en-ca/, /fr-ca/, /es-es/,
    /it-it/, /pt-pt/, /de-at/ and English variants), each with its own sitemap.
  graphql_field: localization
  agent_guidance: >-
    "Use buyer context. Pass context.address_country and context.currency for
    accurate pricing and availability." (hyperice.com/llms.txt)
agent_rules:
  - >-
    Checkout requires human approval. Agents must not complete payment without
    explicit buyer consent.
  - >-
    Prefer the Shop skill (https://shop.app/SKILL.md) over screen-scraping or
    scripting the storefront directly.
  - Respect rate limits; back off on 429 responses.
