  url: https://shop.app/SKILL.md
  note: Hyperice's llms.txt recommends personal-shopping agents install the cross-store Shop skill and
    route purchases through Shop Pay rather than scripting the storefront directly. This is a Shopify-operated
    surface, not a Hyperice-operated one.
