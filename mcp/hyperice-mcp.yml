description: Hyperice runs a live, publicly addressable MCP server as the transport for the Universal
  Commerce Protocol (UCP) shopping service on its Shopify storefront. The server is declared by Hyperice's
  own UCP merchant profile at /.well-known/ucp and advertised to agents in /llms.txt and /agents.md. This
  is a real, provider-published agent surface — not a candidate derived from an OpenAPI.
server:
  name: hyperice-ucp-shopping
  transport: http
  protocol: MCP (JSON-RPC 2.0 over HTTP POST)
  url: https://hyperice.com/api/ucp/mcp
  canonical_url: https://hypericeprod.myshopify.com/api/ucp/mcp
  service: dev.ucp.shopping
  ucp_version: '2026-04-08'
  supported_ucp_versions:
  - '2026-04-08'
  - '2026-01-23'
  spec: https://ucp.dev/2026-04-08/specification/overview/
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
access:
  anonymous_tools_list: false
  gate: ucp-agent-profile
  note: 'tools/list and initialize are reachable but refuse to enumerate without a UCP agent profile.
    An anonymous POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} returns HTTP 422 with JSON-RPC
    error -32001 "UCP discovery failed", data.code "invalid_profile_url", content "Unable to fetch agent
    profile: Missing profile uri". The calling agent must publish a resolvable UCP agent profile URI.
    Tool NAMES and SCHEMAS below are therefore not read from this server''s live tools/list — they are
    taken from the OpenRPC document that Hyperice''s own /.well-known/ucp names as the schema for this
    service, plus the flow Hyperice documents in /llms.txt. Nothing here is invented.'
  authorization_servers:
  - https://accounts.hyperice.com
  - https://shopify.com/authentication/78618525910
  oauth_scopes_relevant:
  - customer-account-mcp-api:full
  rate_limited: true
  rate_limit_note: '"The MCP endpoint is rate-limited per IP. Back off on 429 responses." (hyperice.com/llms.txt)'
capabilities:
- dev.ucp.shopping.catalog.search
- dev.ucp.shopping.catalog.lookup
- dev.ucp.shopping.cart
