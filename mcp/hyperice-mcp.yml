documented_flow:
- step: 1
  action: GET /.well-known/ucp to confirm capabilities
- step: 2
  action: search_catalog to find products matching buyer intent
- step: 3
  action: create_cart to add desired items
- step: 4
  action: create_checkout to start the purchase flow
- step: 5
  action: update_checkout to set shipping address and method
- step: 6
  action: complete_checkout to finalize (buyer must approve payment)
rules:
- Checkout requires human approval. Agents must not complete payment without explicit buyer consent.
- Respect rate limits; back off on 429 responses.
- Pass context.address_country and context.currency for accurate pricing.
alternative_surface:
