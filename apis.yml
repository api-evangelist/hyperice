aid: hyperice
name: Hyperice
description: >-
  Hyperice is a recovery and movement-enhancement technology company founded in
  2010 and headquartered in Irvine, California, known for the Hypervolt
  percussion massage line, the Normatec dynamic air-compression systems it
  acquired in 2020, and the Venom thermal/vibration wearables. Its API surface is
  not a developer platform but an agentic-commerce storefront: hyperice.com runs
  on Shopify and publishes a machine-readable agent contract at /llms.txt and
  /agents.md, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, a live MCP shopping server at /api/ucp/mcp, a fully
  introspectable Shopify Storefront GraphQL API, OIDC/OAuth2 customer accounts at
  accounts.hyperice.com, and an unauthenticated read-only product and collection
  JSON surface.
