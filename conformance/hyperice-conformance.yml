description: >-
  Cross-cutting standards Hyperice's public perimeter does and does not conform
  to, each entry backed by a live observation rather than a marketing claim.
  Hyperice makes no compliance claims of its own anywhere on its site — no trust
  center, no certifications page, no SOC 2 or ISO statement was found.
standards:
- id: ucp-2026-04-08
  name: Universal Commerce Protocol
  conforms: true
  evidence: >-
    /.well-known/ucp returns HTTP 200 declaring version 2026-04-08 (plus
    2026-01-23), the dev.ucp.shopping service over MCP transport, and eight
    capabilities.
  spec: https://ucp.dev/2026-04-08/specification/overview/
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    https://hyperice.com/api/ucp/mcp answers JSON-RPC 2.0 POSTs with well-formed
    MCP error objects. Live but gated behind a UCP agent profile.
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: 'MCP endpoint returns {"jsonrpc":"2.0","id":1,"error":{"code":-32001,...}}'
- id: openrpc-1.3.2
  name: OpenRPC
  conforms: true
  evidence: >-
    Hyperice's own UCP profile designates
    https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json (OpenRPC 1.3.2,
    13 methods) as the schema for its shopping service.
  note: The document is published by UCP, not by Hyperice.
- id: graphql
  name: GraphQL (June 2018 spec)
  conforms: true
  evidence: >-
    Full introspection succeeded unauthenticated — 424 types, QueryRoot with 35
    fields, Mutation with 41 fields.
