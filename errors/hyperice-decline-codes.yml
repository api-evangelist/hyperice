description: Hyperice sells directly through a Shopify checkout, so its API surface does expose card authorization
  failure reasons. These are NOT issuer decline codes in the acquirer sense — Hyperice is a merchant,
  not an acquirer, and the issuer response is masked. What the buyer/agent actually receives is the validation-and-gateway
  subset below, reproduced verbatim from the live Storefront GraphQL schema. Complements errors/hyperice-problem-types.yml.
envelope_field: CartUserError.code / SubmitFailed.errors[].code
issuer_codes_exposed: false
masking_note: No raw issuer decline code, AVS result or CVV result is surfaced. The most specific failure
  an agent can observe is a generic PAYMENTS_CREDIT_CARD_GENERIC, so an agent cannot distinguish "insufficient
  funds" from "issuer declined" and must not retry a declined authorization automatically.
