rfc9457: false
description: Hyperice publishes no error reference page and no RFC 9457 problem types. This catalogue
  is derived from the error enums present in the live Shopify Storefront GraphQL schema introspected from
  hyperice.com on 2026-07-31, plus the HTTP and JSON-RPC error shapes observed directly against each surface.
  Codes are reproduced verbatim from the schema; no code is invented. Card-decline style codes are split
  into errors/hyperice-decline-codes.yml.
envelopes:
- surface: graphql
  channel: transport
  shape: errors[] {message, locations[], path[], extensions{code, typeName, fieldName}}
  http_status: 200
  observed_example:
    query: '{nope}'
    code: undefinedField
    message: Field 'nope' doesn't exist on type 'QueryRoot'
- surface: graphql
  channel: domain
  shape: payload.userErrors[] {field[], message, code}
  http_status: 200
  types:
  - CartUserError
  - CustomerUserError
  - MetafieldsSetUserError
  - MetafieldDeleteUserError
  - UserErrorsShopPayPaymentRequestSessionUserError
  - UserError
  note: Domain failures never change the HTTP status and never appear in the top-level errors[] array.
    An agent must inspect both channels.
- surface: mcp-ucp
  channel: jsonrpc
  shape: error {code, message, data{code, content, continue_url}}
  observed_example:
    http_status: 422
    code: -32001
    message: UCP discovery failed
    data_code: invalid_profile_url
- surface: rest
  channel: http
  shape: bare status, zero-length body
  observed_example:
    url: /products/does-not-exist-xyz.json
    http_status: 404
    content_type: application/json
    body_bytes: 0
problems:
- status: 404
  code: NOT_FOUND
  surface: graphql
  title: Unsupported API version
  detail: Requesting a retired date-versioned path returns HTTP 404 with extensions.code NOT_FOUND.
  source_operation: https://hyperice.com/api/{version}/graphql.json
  remediation: Use a version listed as supported by the publicApiVersions query.
- status: 200
  code: undefinedField
  surface: graphql
  title: Field does not exist on type
  detail: Schema validation failure returned in the top-level errors[] array with extensions.typeName
    and extensions.fieldName.
  remediation: Validate the query against graphql/hyperice-storefront.graphql.
- status: 404
  surface: rest
  title: Product or collection not found
  detail: Empty body with content-type application/json.
  source_operation: openapi/hyperice-storefront-openapi.yml#getProduct
  remediation: Confirm the handle via listProducts; unpublished products are absent from the public surface.
- status: 422
  code: -32001
  surface: mcp-ucp
  title: UCP discovery failed / invalid_profile_url
  detail: The calling agent did not present a resolvable UCP agent profile URI, so tools cannot be enumerated
    or invoked.
  source_operation: mcp/hyperice-mcp.yml#tools/list
  remediation: Publish a UCP agent profile and present its URI; see https://ucp.dev.
- status: 200
  code: IDEMPOTENCY_KEY_ALREADY_USED
  surface: graphql
  title: Idempotency key has already been used
  detail: Returned by the Shop Pay payment-request session flow when an idempotencyKey is replayed with
    different content.
  source_operation: shopPayPaymentRequestSessionSubmit
  remediation: Generate a fresh idempotency key per distinct payment intent; reuse only to retry the identical
    request.
- status: 200
  code: CartThrottled
  surface: graphql
  title: Cart access throttled
  detail: Union member returned by cartPrepareForCompletion instead of an HTTP 429.
  remediation: Back off and retry; branch on the union member, not the HTTP status.
- status: 200
  code: SubmitThrottled
  surface: graphql
  title: Checkout submission throttled
  detail: Union member returned by cartSubmitForCompletion instead of an HTTP 429.
  remediation: Back off and retry.
- status: 429
  surface: mcp-ucp
  title: Rate limited
  detail: Hyperice states in /llms.txt that the MCP endpoint is rate-limited per IP and agents must back
    off on 429.
  remediation: Exponential backoff.
