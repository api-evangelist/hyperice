    x-observed-catalog-size: 68
    x-limitation: >-
      Accepts no query term. Keyword search requires the GraphQL search /
      predictiveSearch fields or the HTML /search?q= route.
- target: $.paths['/products/{handle}.json'].get
  update:
    x-error-shape: >-
      404 returns a zero-length body with content-type application/json — there
      is no error document to parse.
- target: $.paths['/.well-known/ucp'].get
  update:
    x-lead: >-
      This document is the discovery entry point for the MCP shopping server and
      the reason this provider has an agent posture at all.
- target: $.components.schemas.Product
  update:
    x-identifier-warning: >-
      id here is a bare 64-bit integer. The GraphQL surface returns base64
      gid://shopify/Product/{id} global ids. The two are NOT interchangeable —
      join across surfaces on `handle`.
- target: $.components.schemas.Variant
  update:
    x-price-note: >-
      price and compare_at_price are decimal STRINGS in the store currency (USD),
      not numbers. Parse as decimal, never as float.
    x-availability-note: >-
      `available` is the stock flag; never present an unavailable variant as
      purchasable.
